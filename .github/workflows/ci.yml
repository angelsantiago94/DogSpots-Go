name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate contract and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml

      - name: Validate Compose configuration
        run: |
          printf 'JWT_SECRET=ci-only-placeholder-do-not-use-in-production\n' > .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        if: ${{ hashFiles('dogspots-api/go.mod') != '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: dogspots-api/go.mod
          cache-dependency-path: dogspots-api/go.sum

      - name: Run go vet
        if: ${{ hashFiles('dogspots-api/go.mod') != '' }}
        working-directory: dogspots-api
        run: go vet ./...

      - name: Run tests
        if: ${{ hashFiles('dogspots-api/go.mod') != '' }}
        working-directory: dogspots-api
        run: go test ./...

      - name: Build Go packages
        if: ${{ hashFiles('dogspots-api/go.mod') != '' }}
        working-directory: dogspots-api
        run: go build ./...

      - name: Build API image
        if: ${{ hashFiles('dogspots-api/Dockerfile') != '' }}
        run: docker build --tag dogspots-api:ci ./dogspots-api

      - name: Explain skipped backend checks
        if: ${{ hashFiles('dogspots-api/go.mod') == '' }}
        run: echo 'Backend checks will run after dogspots-api/go.mod is added.'

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon