# DogSpots - API local (Nginx se ejecuta en el host de producción)
# Uso: crear .env con JWT_SECRET y ejecutar docker compose up -d --build

services:
  api:
    build:
      context: ./dogspots-api
      dockerfile: Dockerfile
    container_name: dogspots-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DB_PATH: /data/db/dogspots.db
      MEDIA_DIR: /data/media
      # Obligatoria: el arranque falla si no está definida
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el fichero .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
    volumes:
      - db_data:/data/db        # fichero SQLite (+ WAL)
      - media_data:/data/media  # fotos y miniaturas
    # Exponer en todas las interfaces para permitir conectar móviles físicos por Wi-Fi
    ports:
      - "0.0.0.0:8080:8080"
    healthcheck:
      # Requiere wget en la imagen final (alpine/busybox lo incluye)
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend


volumes:
  db_data:
  media_data:

networks:
  backend:
